[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-customer-agent-rl"
version = "0.1.0"
description = "A compact customer-service tool-agent harness for trace analysis, SFT and optional GRPO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["openai>=1.40"]
train = [
  "accelerate>=1.2",
  "datasets>=3.0",
  "jmespath>=1.0",
  "peft>=0.14",
  "torch>=2.5",
  "transformers>=5.2.0,<6.0",
  "trl>=1.13.0,<2.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
customer-agent = "mini_customer_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
